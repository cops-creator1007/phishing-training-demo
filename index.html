<!DOCTYPE html>
<html>
<head>
  <title>Training Simulation</title>
</head>

<body style="text-align:center; padding-top:70px; font-family:Arial;">

  <h2>Log in to your Insta account</h2>

  <p style="font-size:14px;">
    🔐 its not a fraud
  </p>

  <input type="text" placeholder="Username" id="username"
         style="padding:12px; width:250px; margin:5px;"><br>

  <input type="password" placeholder="Password" id="password"
         style="padding:12px; width:250px; margin:5px;"><br>

  <button onclick="simulate()"
          style="padding:10px 25px; margin-top:10px;">
    Log In
  </button>

  <p id="result"></p>

  <script>
    function simulate() {
      document.getElementById("result").innerText =
        "⚠️ TRAINING SIMULATION — कोणताही username किंवा password save/send केलेला नाही.";
    }
  </script>

</body>
</html>
